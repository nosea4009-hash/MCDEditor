<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor de Discusiones de Mesoescala (MCD)</title>
  <style>
:root {
  --bg: #0f141b;
  --panel: #18202b;
  --panel-2: #1f2937;
  --border: #2a3543;
  --text: #e6edf3;
  --muted: #9bafc4;
  --accent: #2f81f7;
  --accent-2: #1769ff;
  --danger: #e5484d;
  --ok: #2ea043;
  --shadow: 0 4px 14px rgba(0,0,0,.35);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%;
  font-family: "Segoe UI", Arial, Helvetica, sans-serif;
  background: var(--bg); color: var(--text);
  overflow: hidden;
}

/* ---------- Top bar ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; padding: 0 14px;
  background: linear-gradient(180deg, #1c2530, #151c25);
  border-bottom: 1px solid var(--border);
  gap: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo { font-size: 24px; }
.brand strong { display: block; font-size: 15px; }
.brand small { color: var(--muted); font-size: 11px; }

.file-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sep { width: 1px; height: 26px; background: var(--border); margin: 0 4px; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--panel-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 7px 11px; font-size: 13px; cursor: pointer;
  transition: background .12s, border-color .12s, transform .05s;
  user-select: none; white-space: nowrap;
}
.btn:hover { background: #28323f; border-color: #3a4757; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #4a92f9; }

/* ---------- Layout ---------- */
.main { display: flex; height: calc(100% - 56px); }

/* ---------- Left toolbar ---------- */
.toolbar {
  width: 188px; flex-shrink: 0;
  background: var(--panel); border-right: 1px solid var(--border);
  padding: 12px 10px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 16px;
}
.tool-group { display: flex; flex-direction: column; gap: 5px; }
.tool-label {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); margin-bottom: 3px; font-weight: 600;
}
.tool {
  display: flex; align-items: center; gap: 8px;
  background: var(--panel-2); border: 1px solid var(--border);
  color: var(--text); border-radius: 8px; padding: 8px 10px;
  font-size: 13px; cursor: pointer; text-align: left;
  transition: background .12s, border-color .12s;
}
.tool:hover { background: #28323f; }
.tool.active { background: #14365e; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.swatch { width: 26px; height: 12px; border-radius: 3px; display: inline-block; }
.swatch.cold { background: #2b6cff; }
.swatch.warm { background: #e23b3b; }
.swatch.occ  { background: #9b30d0; }
.swatch.stat { background: linear-gradient(90deg, #2b6cff 50%, #e23b3b 50%); }
.swatch.dry  { background: #c8861f; }
.swatch.out  { background: repeating-linear-gradient(90deg,#1f9e6b,#1f9e6b 4px,transparent 4px,transparent 7px); }
.swatch.trough { background: repeating-linear-gradient(90deg,#7a4ad0,#7a4ad0 6px,transparent 6px,transparent 10px); }

.tool-hint {
  margin-top: auto; font-size: 11.5px; color: var(--muted);
  background: var(--panel-2); border: 1px dashed var(--border);
  border-radius: 8px; padding: 9px; line-height: 1.45;
}

/* ---------- Stage ---------- */
.stage { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #0b0f14; }
.stage-toolbar {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px; border-bottom: 1px solid var(--border);
  background: var(--panel);
}
.mini {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 13px;
}
.mini:hover { background: #28323f; }
#zoomLabel { font-size: 12px; color: var(--muted); min-width: 60px; text-align: center; }

.canvas-scroll {
  flex: 1; overflow: auto; padding: 24px;
  background:
    linear-gradient(45deg, #161c24 25%, transparent 25%),
    linear-gradient(-45deg, #161c24 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #161c24 75%),
    linear-gradient(-45deg, transparent 75%, #161c24 75%);
  background-size: 22px 22px;
  background-position: 0 0, 0 11px, 11px -11px, -11px 0;
  display: flex; align-items: flex-start; justify-content: center;
}
.canvas-holder { box-shadow: var(--shadow); }
#board { display: block; background: #fff; cursor: crosshair; }
.tool-select #board { cursor: default; }

.statusbar {
  height: 26px; line-height: 26px; padding: 0 12px;
  font-size: 12px; color: var(--muted);
  background: var(--panel); border-top: 1px solid var(--border);
}

/* ---------- Right panel ---------- */
.panel {
  width: 264px; flex-shrink: 0;
  background: var(--panel); border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
}
.panel-header {
  padding: 12px 14px; font-weight: 600; font-size: 14px;
  border-bottom: 1px solid var(--border);
}
.panel-body { padding: 12px 14px; overflow-y: auto; flex: 1; }

.field { margin-bottom: 13px; }
.field > label {
  display: block; font-size: 11px; text-transform: uppercase;
  letter-spacing: .05em; color: var(--muted); margin-bottom: 5px; font-weight: 600;
}
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; }

select, input[type="text"], input[type="number"] {
  width: 100%; background: var(--panel-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 7px;
  padding: 7px 9px; font-size: 13px; font-family: inherit;
}
input[type="color"] {
  width: 100%; height: 34px; padding: 2px; border: 1px solid var(--border);
  border-radius: 7px; background: var(--panel-2); cursor: pointer;
}
input[type="range"] { width: 100%; }

.seg { display: flex; gap: 4px; }
.seg button {
  flex: 1; background: var(--panel-2); border: 1px solid var(--border);
  color: var(--text); border-radius: 6px; padding: 6px; cursor: pointer; font-size: 13px;
}
.seg button.on { background: #14365e; border-color: var(--accent); }

.btn-block {
  width: 100%; justify-content: center; margin-bottom: 7px;
}
.btn.danger { background: #3a1d1f; border-color: #5a2b2e; color: #ff9a9d; }
.btn.danger:hover { background: #4a2326; }

.muted-note { font-size: 12px; color: var(--muted); line-height: 1.5; }

.divider { height: 1px; background: var(--border); margin: 14px 0; }

.checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.checkbox-row input { width: auto; flex: none; }

/* ---------- inline text editor ---------- */
.text-editor {
  position: fixed; display: none; z-index: 999;
  border: 2px solid var(--accent-2); border-radius: 3px;
  padding: 4px 6px; resize: none; outline: none;
  background: rgba(255,255,255,.97); color: #111;
  box-shadow: 0 6px 22px rgba(0,0,0,.4); overflow: hidden;
  line-height: 1.3;
}

</style>
</head>
<body>
  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">⛈️</span>
      <div>
        <strong>Editor MCD</strong>
        <small>Discusiones de Mesoescala · estilo SPC</small>
      </div>
    </div>
    <div class="file-actions">
      <label class="btn primary" title="Cargar imagen de radar o satélite">
        📷 Cargar imagen
        <input type="file" id="imageInput" accept="image/*" hidden />
      </label>
      <button class="btn" id="btnNewCanvas" title="Lienzo en blanco">📄 Lienzo en blanco</button>
      <span class="sep"></span>
      <button class="btn" id="btnExportPng" title="Exportar como PNG">⬇️ Exportar PNG</button>
      <button class="btn" id="btnSaveProj" title="Guardar proyecto editable (.json)">💾 Guardar</button>
      <label class="btn" title="Abrir proyecto .json">
        📂 Abrir
        <input type="file" id="projInput" accept="application/json" hidden />
      </label>
      <span class="sep"></span>
      <button class="btn" id="btnUndo" title="Deshacer (Ctrl+Z)">↶</button>
      <button class="btn" id="btnRedo" title="Rehacer (Ctrl+Y)">↷</button>
    </div>
  </header>

  <div class="main">
    <!-- Left toolbar -->
    <nav class="toolbar" id="toolbar">
      <div class="tool-group">
        <span class="tool-label">Herramientas</span>
        <button class="tool" data-tool="select" title="Seleccionar / mover (V)">▣ Seleccionar</button>
        <button class="tool" data-tool="text" title="Texto libre (T)">🅣 Texto</button>
        <button class="tool" data-tool="place-textbox" title="Caja con texto (estilo número MCD)">▭ Caja de texto</button>
        <button class="tool" data-tool="arrow" title="Flecha">➤ Flecha</button>
        <button class="tool" data-tool="polyline" title="Poli-línea (clics; doble clic para terminar)">⤳ Poli-línea</button>
        <button class="tool" data-tool="freehand" title="Trazo libre">✎ Trazo libre</button>
        <button class="tool" data-tool="polygon" title="Área / polígono resaltado">⬡ Área</button>
        <button class="tool" data-tool="rect" title="Rectángulo">▢ Rectángulo</button>
        <button class="tool" data-tool="ellipse" title="Elipse / círculo">◯ Elipse</button>
      </div>

      <div class="tool-group">
        <span class="tool-label">Frentes</span>
        <button class="tool front" data-tool="front" data-front="cold" title="Frente frío (triángulos azules)">
          <span class="swatch cold"></span> Frío
        </button>
        <button class="tool front" data-tool="front" data-front="warm" title="Frente cálido (semicírculos rojos)">
          <span class="swatch warm"></span> Cálido
        </button>
        <button class="tool front" data-tool="front" data-front="occluded" title="Frente ocluido (morado)">
          <span class="swatch occ"></span> Ocluido
        </button>
        <button class="tool front" data-tool="front" data-front="stationary" title="Frente estacionario">
          <span class="swatch stat"></span> Estacionario
        </button>
        <button class="tool front" data-tool="front" data-front="dryline" title="Línea seca (dryline)">
          <span class="swatch dry"></span> Dryline
        </button>
        <button class="tool front" data-tool="front" data-front="outflow" title="Límite de outflow">
          <span class="swatch out"></span> Outflow
        </button>
        <button class="tool front" data-tool="front" data-front="trough" title="Vaguada (trough)">
          <span class="swatch trough"></span> Vaguada
        </button>
      </div>

      <div class="tool-hint" id="toolHint">
        Carga una imagen para empezar. Luego elige una herramienta.
      </div>
    </nav>

    <!-- Stage -->
    <section class="stage" id="stage">
      <div class="stage-toolbar">
        <button class="mini" id="btnZoomOut" title="Alejar">−</button>
        <span id="zoomLabel">Ajustar</span>
        <button class="mini" id="btnZoomIn" title="Acercar">+</button>
        <button class="mini" id="btnZoomFit" title="Ajustar a ventana">⤢ Ajustar</button>
        <button class="mini" id="btnZoom100" title="Tamaño real">1:1</button>
      </div>
      <div class="canvas-scroll" id="canvasScroll">
        <div class="canvas-holder" id="canvasHolder">
          <canvas id="board" width="1200" height="800"></canvas>
        </div>
      </div>
      <div class="statusbar" id="statusbar">Listo.</div>
    </section>

    <!-- Right properties panel -->
    <aside class="panel" id="panel">
      <div class="panel-header" id="panelTitle">Propiedades</div>
      <div class="panel-body" id="panelBody">
        <!-- populated dynamically -->
      </div>
    </aside>
  </div>

  <!-- inline text editor -->
  <textarea id="textEditor" class="text-editor" spellcheck="false"></textarea>

  <script>
/* geometry.js — vector math & path helpers (no dependencies) */
(function (global) {
  "use strict";

  const Geo = {};

  // ---- basic vector helpers ----
  Geo.dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  Geo.lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });

  Geo.sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
  Geo.add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
  Geo.scale = (a, s) => ({ x: a.x * s, y: a.y * s });

  Geo.norm = (v) => {
    const len = Math.hypot(v.x, v.y) || 1;
    return { x: v.x / len, y: v.y / len };
  };

  // perpendicular (rotate 90deg CCW)
  Geo.perp = (v) => ({ x: -v.y, y: v.x });

  // rotate point p around center c by angle (radians)
  Geo.rotate = (p, c, ang) => {
    const cos = Math.cos(ang), sin = Math.sin(ang);
    const dx = p.x - c.x, dy = p.y - c.y;
    return { x: c.x + dx * cos - dy * sin, y: c.y + dx * sin + dy * cos };
  };

  // ---- distance from point to segment ----
  Geo.pointSegmentDistance = function (p, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const lenSq = dx * dx + dy * dy;
    if (lenSq === 0) return Geo.dist(p, a);
    let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    const proj = { x: a.x + t * dx, y: a.y + t * dy };
    return Geo.dist(p, proj);
  };

  // distance from point to a polyline (array of points)
  Geo.pointPolylineDistance = function (p, pts) {
    if (!pts || pts.length === 0) return Infinity;
    if (pts.length === 1) return Geo.dist(p, pts[0]);
    let min = Infinity;
    for (let i = 0; i < pts.length - 1; i++) {
      const d = Geo.pointSegmentDistance(p, pts[i], pts[i + 1]);
      if (d < min) min = d;
    }
    return min;
  };

  // point in polygon (ray casting)
  Geo.pointInPolygon = function (p, pts) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i].x, yi = pts[i].y;
      const xj = pts[j].x, yj = pts[j].y;
      const intersect =
        yi > p.y !== yj > p.y &&
        p.x < ((xj - xi) * (p.y - yi)) / (yj - yi) + xi;
      if (intersect) inside = !inside;
    }
    return inside;
  };

  // axis-aligned bounding box of points
  Geo.bbox = function (pts) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const p of pts) {
      if (p.x < minX) minX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.x > maxX) maxX = p.x;
      if (p.y > maxY) maxY = p.y;
    }
    return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  };

  // ---- Catmull-Rom spline -> flattened fine polyline ----
  // Returns an array of fine points that smoothly pass through the input points.
  Geo.smoothPath = function (points, tension) {
    if (!points || points.length < 3) return (points || []).slice();
    tension = tension == null ? 0.5 : tension;
    const result = [];
    const pts = points;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[i + 2] || pts[i + 1];
      const segLen = Geo.dist(p1, p2);
      const steps = Math.max(6, Math.floor(segLen / 6));
      for (let s = 0; s < steps; s++) {
        const t = s / steps;
        const t2 = t * t;
        const t3 = t2 * t;
        const x =
          0.5 *
          ((2 * p1.x) +
            (-p0.x + p2.x) * t +
            (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
            (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
        const y =
          0.5 *
          ((2 * p1.y) +
            (-p0.y + p2.y) * t +
            (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
            (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3);
        result.push({ x, y });
      }
    }
    result.push(pts[pts.length - 1]);
    return result;
  };

  // Walk along a fine polyline and return sample points spaced ~`spacing` apart,
  // each with a unit tangent. Used to place front symbols.
  Geo.sampleAlong = function (finePts, spacing) {
    const samples = [];
    if (!finePts || finePts.length < 2) return samples;
    let distSoFar = 0;
    let nextAt = spacing * 0.5; // start a little in from the beginning
    for (let i = 0; i < finePts.length - 1; i++) {
      const a = finePts[i];
      const b = finePts[i + 1];
      let segLen = Geo.dist(a, b);
      if (segLen === 0) continue;
      const dir = { x: (b.x - a.x) / segLen, y: (b.y - a.y) / segLen };
      while (nextAt <= distSoFar + segLen) {
        const t = (nextAt - distSoFar) / segLen;
        samples.push({
          x: a.x + dir.x * segLen * t,
          y: a.y + dir.y * segLen * t,
          tx: dir.x,
          ty: dir.y,
        });
        nextAt += spacing;
      }
      distSoFar += segLen;
    }
    return samples;
  };

  global.Geo = Geo;
})(window);

</script>
  <script>
/* fronts.js — render meteorological fronts onto a 2D canvas context */
(function (global) {
  "use strict";

  const Fronts = {};

  // Standard meteorological colors
  Fronts.COLORS = {
    cold: "#2b6cff",      // blue
    warm: "#e23b3b",      // red
    occluded: "#9b30d0",  // purple
    stationary_cold: "#2b6cff",
    stationary_warm: "#e23b3b",
    dryline: "#c8861f",   // orange/brown
    outflow: "#1f9e6b",   // teal/green
    trough: "#7a4ad0",
  };

  // Draw a filled triangle (cold-front pip) sitting on the line at sample s,
  // pointing to the chosen side. size = pip size in px.
  function drawTriangle(ctx, s, side, size, color) {
    const t = { x: s.tx, y: s.ty };
    const n = { x: -t.y * side, y: t.x * side }; // perpendicular toward side
    const base1 = { x: s.x - t.x * size * 0.5, y: s.y - t.y * size * 0.5 };
    const base2 = { x: s.x + t.x * size * 0.5, y: s.y + t.y * size * 0.5 };
    const apex = { x: s.x + n.x * size, y: s.y + n.y * size };
    ctx.beginPath();
    ctx.moveTo(base1.x, base1.y);
    ctx.lineTo(base2.x, base2.y);
    ctx.lineTo(apex.x, apex.y);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  // Draw a filled semicircle (warm-front bump) bulging to the chosen side.
  function drawSemicircle(ctx, s, side, size, color) {
    const r = size * 0.55;
    const baseAngle = Math.atan2(s.ty, s.tx);
    // The flat side lies along the tangent; bump bulges toward `side`.
    ctx.beginPath();
    // sweep direction depends on side
    if (side > 0) {
      ctx.arc(s.x, s.y, r, baseAngle, baseAngle + Math.PI, true);
    } else {
      ctx.arc(s.x, s.y, r, baseAngle, baseAngle - Math.PI, false);
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  // Stroke a smoothed line through the given fine points.
  function strokeLine(ctx, finePts, color, width, dash) {
    if (finePts.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(finePts[0].x, finePts[0].y);
    for (let i = 1; i < finePts.length; i++) ctx.lineTo(finePts[i].x, finePts[i].y);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.setLineDash(dash || []);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  /**
   * Draw a front.
   * @param ctx canvas 2d context
   * @param points array of {x,y} anchor points (user clicks)
   * @param opts { type, side, lineWidth, scale }
   *   type: 'cold' | 'warm' | 'occluded' | 'stationary' | 'dryline' | 'outflow' | 'trough'
   *   side: +1 or -1 (which side the pips face)
   */
  Fronts.draw = function (ctx, points, opts) {
    opts = opts || {};
    const type = opts.type || "cold";
    const side = opts.side === -1 ? -1 : 1;
    const lineWidth = opts.lineWidth || 4;
    const scale = opts.scale || 1;
    const pipSize = 13 * scale;
    const spacing = 42 * scale;

    if (!points || points.length < 2) {
      // Not enough to render a full front; draw what we have as a thin guide
      if (points && points.length === 1) return;
      return;
    }

    const fine = Geo.smoothPath(points, 0.5);
    const samples = Geo.sampleAlong(fine, spacing);

    ctx.save();
    ctx.lineDash = [];

    if (type === "cold") {
      strokeLine(ctx, fine, Fronts.COLORS.cold, lineWidth);
      for (const s of samples) drawTriangle(ctx, s, side, pipSize, Fronts.COLORS.cold);
    } else if (type === "warm") {
      strokeLine(ctx, fine, Fronts.COLORS.warm, lineWidth);
      for (const s of samples) drawSemicircle(ctx, s, side, pipSize, Fronts.COLORS.warm);
    } else if (type === "occluded") {
      strokeLine(ctx, fine, Fronts.COLORS.occluded, lineWidth);
      samples.forEach((s, i) => {
        if (i % 2 === 0) drawTriangle(ctx, s, side, pipSize, Fronts.COLORS.occluded);
        else drawSemicircle(ctx, s, side, pipSize, Fronts.COLORS.occluded);
      });
    } else if (type === "stationary") {
      // Alternating: blue triangles on one side, red semicircles on the other.
      strokeLine(ctx, fine, Fronts.COLORS.cold, lineWidth);
      samples.forEach((s, i) => {
        if (i % 2 === 0) drawTriangle(ctx, s, side, pipSize, Fronts.COLORS.stationary_cold);

/* editor.js — canvas editor core: tools, selection, transforms, history */
(function (global) {
  "use strict";

  function Editor() {
    this.canvas = null;
    this.ctx = null;
    this.objects = [];
    this.selectedId = null;
    this.tool = "select";
    this.style = {
      stroke: "#111111",
      strokeWidth: 3,
      fontFamily: "Arial",
      fontSize: 22,
      textColor: "#111111",
      bold: false,
      italic: false,
      frontType: "cold",
      side: 1,
      lineWidth: 4,
      scale: 1,

    this.future = [];

    this.draftPreview = null; // cursor preview point
    this.drag = null;         // active drag operation

      y: (clientY - r.top) * (this.canvas.height / r.height),
    };

    ctx.lineWidth = 1.5 / this._screenScale;
    ctx.setLineDash([6 / this._screenScale, 4 / this._screenScale]);
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.setLineDash([]);

    if (Shapes.isPointBased(s)) {
      // vertex handles
      const r = 5 / this._screenScale;
      for (const p of s.points) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.strokeStyle = "#1769ff";
        ctx.lineWidth = 1.5 / this._screenScale;
        ctx.stroke();
      }
    } else {
      for (const h of this._handleRects(s)) {
        ctx.beginPath();
        ctx.rect(h.x - h.r, h.y - h.r, h.r * 2, h.r * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.strokeStyle = "#1769ff";
        ctx.lineWidth = 1.5 / this._screenScale;
        ctx.stroke();
      }
    }
    ctx.restore();
  };

  // ---------- hit testing helpers ----------
  Editor.prototype._topAt = function (p) {
    for (let i = this.objects.length - 1; i >= 0; i--) {
      if (Shapes.hitTest(this.objects[i], p, 6 / this._screenScale)) return this.objects[i];
    }
    return null;
  };

  Editor.prototype._handleAt = function (s, p) {
    const tol = 7 / this._screenScale;
    if (Shapes.isPointBased(s)) {
      for (let i = 0; i < s.points.length; i++) {
        if (Geo.dist(p, s.points[i]) <= tol) return { vertex: i };
      }
      return null;
    }
    for (const h of this._handleRects(s)) {
      if (Math.abs(p.x - h.x) <= tol && Math.abs(p.y - h.y) <= tol) return { handle: h.name };
    }
    return null;
  };

  // ---------- event binding ----------
  Editor.prototype._bindEvents = function () {
    const c = this.canvas;
    c.addEventListener("pointerdown", (e) => this._onDown(e));
    c.addEventListener("pointermove", (e) => this._onMove(e));
    window.addEventListener("pointerup", (e) => this._onUp(e));
    c.addEventListener("dblclick", (e) => this._onDblClick(e));
  };

  Editor.prototype._onDown = function (e) {
    e.preventDefault();
    this._updateScreenScale();
    const p = this.toCanvas(e.clientX, e.clientY);
    const tool = this.tool;

    // multi-point tools accumulate via clicks
    if (["polyline", "polygon", "front"].includes(tool)) {
      if (!this.draft) {
        this.draft = Shapes.create(tool, this.style);
        this.draft.points = [];
      }
      this.draft.points.push({ x: p.x, y: p.y });
      this.draftPreview = { x: p.x, y: p.y };
      this.render();
      return;
    }

    if (tool === "select") {
      const sel = this.getSelected();
      if (sel) {
        const h = this._handleAt(sel, p);
        if (h) {
          this.drag = { mode: "transform", h, startBox: Shapes.bounds(sel), startPts: JSON.parse(JSON.stringify(sel.points || null)), last: p, moved: false };
          try { this.canvas.setPointerCapture(e.pointerId); } catch (_) {}
          return;
        }
      }
      const hit = this._topAt(p);
      this.selectedId = hit ? hit.id : null;
      if (hit) {
        this.drag = { mode: "move", last: p, moved: false };
        try { this.canvas.setPointerCapture(e.pointerId); } catch (_) {}
      }
      this.render();
      this._emitChange();
      return;
    }

    // drag-to-create tools
    if (["rect", "ellipse", "textbox", "arrow", "freehand"].includes(tool)) {
      const s = Shapes.create(tool, this.style);
      if (tool === "arrow" || tool === "freehand") {
        s.points = [{ x: p.x, y: p.y }];
        if (tool === "arrow") s.points.push({ x: p.x, y: p.y });
      } else {
        s.x = p.x; s.y = p.y; s.w = 1; s.h = 1;
      }
      this.objects.push(s);
      this.selectedId = s.id;
      this.drag = { mode: "create", tool, start: p, last: p };
      try { this.canvas.setPointerCapture(e.pointerId); } catch (_) {}
      this.render();
      return;
    }

    if (tool === "text" || tool === "place-textbox") {
      const s = Shapes.create(tool === "text" ? "text" : "textbox", this.style);
      if (s.type === "text") { s.x = p.x; s.y = p.y; }
      else { s.x = p.x; s.y = p.y; }
      this.objects.push(s);
      this.selectedId = s.id;
      this.pushHistory();
      this.render();
      this._emitChange();
      this.setTool("select");
      if (this.onEditText) this.onEditText(s);
      return;
    }
  };

  Editor.prototype._onMove = function (e) {
    const p = this.toCanvas(e.clientX, e.clientY);

    if (this.draft) {
      this.draftPreview = { x: p.x, y: p.y };
      this.render();
      return;
    }

    if (!this.drag) {
      // cursor feedback could go here
      return;
    }

    const d = this.drag;
    const sel = this.getSelected();

    if (d.mode === "create" && sel) {
      if (d.tool === "arrow") {
        sel.points[1] = { x: p.x, y: p.y };
        if (e.shiftKey) sel.points[1] = this._constrain(sel.points[0], p);
      } else if (d.tool === "freehand") {
        const last = sel.points[sel.points.length - 1];
        if (Geo.dist(last, p) > 2) sel.points.push({ x: p.x, y: p.y });
      } else {
        sel.w = p.x - sel.x;
        sel.h = p.y - sel.y;
        if (e.shiftKey) { const m = Math.max(Math.abs(sel.w), Math.abs(sel.h)); sel.w = Math.sign(sel.w || 1) * m; sel.h = Math.sign(sel.h || 1) * m; }
      }
      this.render();
      return;
    }

    if (d.mode === "move" && sel) {
      const dx = p.x - d.last.x, dy = p.y - d.last.y;
      Shapes.move(sel, dx, dy);
      d.last = p; d.moved = true;
      this.render();
      return;
    }

    if (d.mode === "transform" && sel) {
      if (d.h.vertex != null) {
        sel.points[d.h.vertex] = { x: p.x, y: p.y };
      } else {
        this._resizeBox(sel, d.h.handle, d.startBox, p, e.shiftKey);
      }
      d.moved = true;
      this.render();
      return;
    }
  };

  Editor.prototype._onUp = function (e) {
    if (this.drag) {
      const d = this.drag;
      const sel = this.getSelected();
      if (d.mode === "create" && sel) {
        // discard degenerate shapes
        const b = Shapes.bounds(sel);
        const tiny = (b.w < 3 && b.h < 3);
        if ((sel.type === "rect" || sel.type === "ellipse" || sel.type === "textbox") && tiny) {
          // give a default size if just a click
          sel.w = sel.type === "textbox" ? 220 : 120;
          sel.h = sel.type === "textbox" ? 90 : 80;
        }
        this.pushHistory();
        if (sel.type === "textbox" && this.onEditText) this.onEditText(sel);
        this.setTool("select");
        this._emitChange();
      } else if (d.moved) {
        this.pushHistory();
      }
      this.drag = null;
      this.render();
    }
  };

  Editor.prototype._onDblClick = function (e) {
    const p = this.toCanvas(e.clientX, e.clientY);
    if (this.draft) { this._finishDraft(); return; }
    const hit = this._topAt(p);
    if (hit && (hit.type === "text" || hit.type === "textbox")) {
      this.selectedId = hit.id;
      this.render();
      this._emitChange();
      if (this.onEditText) this.onEditText(hit);
    }
  };

  Editor.prototype._constrain = function (a, b) {
    // snap to 0/45/90 degrees
    const dx = b.x - a.x, dy = b.y - a.y;
    const ang = Math.atan2(dy, dx);
    const snap = Math.round(ang / (Math.PI / 4)) * (Math.PI / 4);
    const len = Math.hypot(dx, dy);
    return { x: a.x + Math.cos(snap) * len, y: a.y + Math.sin(snap) * len };
  };

  Editor.prototype._resizeBox = function (s, handle, start, p, keepAspect) {
    let x = start.x, y = start.y, w = start.w, h = start.h;
    const right = x + w, bottom = y + h;
    if (handle.includes("w")) { x = p.x; w = right - p.x; }
    if (handle.includes("e")) { w = p.x - x; }
    if (handle.includes("n")) { y = p.y; h = bottom - p.y; }
    if (handle.includes("s")) { h = p.y - y; }
    if (keepAspect && start.w && start.h) {
      const ar = start.w / start.h;
      if (Math.abs(w) / ar > Math.abs(h)) h = Math.sign(h || 1) * Math.abs(w) / ar;
      else w = Math.sign(w || 1) * Math.abs(h) * ar;
    }
    s.x = x; s.y = y; s.w = w; s.h = h;
  };

  // ---------- draft finishing ----------
  Editor.prototype._finishDraft = function () {
    if (!this.draft) return;
    const d = this.draft;
    // need minimum points
    const min = d.type === "polygon" ? 3 : 2;
    if (d.points.length >= min) {
      this.objects.push(d);
      this.selectedId = d.id;
      this.pushHistory();
    }
    this.draft = null;
    this.draftPreview = null;
    this.setTool("select");
    this.render();
    this._emitChange();
  };

  Editor.prototype.cancelDraft = function () {
    this.draft = null;
    this.draftPreview = null;
    this.render();
  };

  // ---------- tools ----------
  Editor.prototype.setTool = function (tool) {
    if (this.draft && tool !== this.tool) this.cancelDraft();
    this.tool = tool;
    if (tool !== "select") { /* keep selection visible only in select mode */ }
    this.render();
    if (this.onToolChange) this.onToolChange(tool);
  };

  Editor.prototype.setStyle = function (partial) {
    Object.assign(this.style, partial);
  };

  // ---------- export / project ----------
  Editor.prototype.exportPNG = function (filename) {
    const prevSel = this.selectedId;
    const prevTool = this.tool;
    this.selectedId = null;
    this.tool = "export";
    this._draw(); // draw without selection overlay synchronously
    const url = this.canvas.toDataURL("image/png");
    this.selectedId = prevSel;
    this.tool = prevTool;
    this.render();
    const a = document.createElement("a");
    a.href = url;
    a.download = filename || "discusion-mesoescala.png";
    a.click();
  };

  Editor.prototype.exportProject = function () {
    const data = {
      version: 1,
      width: this.canvas.width,
      height: this.canvas.height,
      objects: this.serializeObjects(),
    };
    const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "mcd-proyecto.json";
    a.click();
    URL.revokeObjectURL(url);
  };

  Editor.prototype.loadProject = function (data) {
    if (!data || !data.objects) return;
    if (data.width && data.height) this.setCanvasSize(data.width, data.height);
    this.objects = data.objects.map((o) => this._reattach(o));
    this.selectedId = null;
    this.history = [];
    this.future = [];
    this.pushHistory();
    this.render();
    this._emitChange();
  };

  Editor.prototype._emitChange = function () {
    if (this.onChange) this.onChange();
  };

  global.Editor = Editor;
})(window);

  <script>
/* main.js — UI wiring for the MCD editor */
(function () {
  "use strict";

  const editor = new Editor();
  const canvas = document.getElementById("board");
  editor.init(canvas);

  // ---- DOM refs ----
  const $ = (id) => document.getElementById(id);
  const stage = $("stage");
  const statusbar = $("statusbar");
  const panelBody = $("panelBody");
  const panelTitle = $("panelTitle");
  const toolHint = $("toolHint");
  const textEditor = $("textEditor");
  const canvasScroll = $("canvasScroll");

  const FONTS = [
    "Arial", "Helvetica", "Verdana", "Tahoma", "Trebuchet MS",
    "Segoe UI", "Calibri", "Times New Roman", "Georgia",
    "Courier New", "Consolas", "Impact", "Comic Sans MS",
  ];

  const FRONT_TYPES = [
    ["cold", "Frente frío"],
    ["warm", "Frente cálido"],
    ["occluded", "Frente ocluido"],
    ["stationary", "Frente estacionario"],
    ["dryline", "Línea seca (dryline)"],
    ["outflow", "Límite de outflow"],
    ["trough", "Vaguada (trough)"],
  ];

  // ---- status ----
  function setStatus(msg) { statusbar.textContent = msg; }
  editor.onStatus = setStatus;

  // ============================================================
  // Tools
  // ============================================================
  const toolButtons = Array.from(document.querySelectorAll(".tool"));
  toolButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      const tool = btn.dataset.tool;
      if (btn.dataset.front) editor.setStyle({ frontType: btn.dataset.front });
      editor.setTool(tool);
      activateToolButton(btn);
      updateToolHint(tool, btn.dataset.front);
    });
  });

  function activateToolButton(activeBtn) {
    toolButtons.forEach((b) => b.classList.remove("active"));
    if (activeBtn) activeBtn.classList.add("active");
    stage.classList.toggle("tool-select", editor.tool === "select");
  }

  function syncToolButtons() {
    let match = null;
    toolButtons.forEach((b) => {
      const isFront = b.dataset.tool === "front";
      const ok = b.dataset.tool === editor.tool &&
        (!isFront || b.dataset.front === editor.style.frontType);
      if (ok && !match) match = b;
    });
    activateToolButton(match);
  }

  editor.onToolChange = function () { syncToolButtons(); };

  const HINTS = {
    select: "Clic para seleccionar. Arrastra para mover. Tira de los puntos/tiradores para ajustar. Doble clic en un texto para editarlo.",
    text: "Clic en el lienzo para colocar texto. Se abrirá el editor.",
    "place-textbox": "Clic para colocar una caja blanca con borde (estilo número MCD). Doble clic para editar su texto.",
    arrow: "Arrastra para dibujar una flecha. Mantén Shift para ángulos de 45°.",
    polyline: "Clic para añadir puntos. Doble clic o Enter para terminar. Esc cancela.",
    freehand: "Mantén presionado y arrastra para dibujar a mano alzada.",
    polygon: "Clic para añadir vértices del área. Doble clic o Enter para cerrar el polígono.",
    rect: "Arrastra para dibujar un rectángulo. Shift = cuadrado.",
    ellipse: "Arrastra para dibujar una elipse. Shift = círculo.",
    front: "Clic para añadir puntos del frente. Doble clic o Enter para terminar. Usa 'Voltear lado' para cambiar la dirección de los símbolos.",
  };
  function updateToolHint(tool, front) {
    let h = HINTS[tool] || "";
    if (tool === "front" && front) h = (Fronts.LABELS[front] || "Frente") + ". " + HINTS.front;
    toolHint.textContent = h;
  }

  // ============================================================
  // File actions
  // ============================================================
  $("imageInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      editor.loadImageAsBackground(reader.result);
      setTimeout(fitZoom, 60);
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  });

  $("btnNewCanvas").addEventListener("click", () => {
    const w = parseInt(prompt("Ancho del lienzo (px):", "1200"), 10);
    const h = parseInt(prompt("Alto del lienzo (px):", "800"), 10);
    if (w > 0 && h > 0) {
      editor.objects = editor.objects.filter((o) => o.type !== "image");
      editor.setCanvasSize(w, h);
      editor.pushHistory();
      fitZoom();
      setStatus(`Lienzo en blanco ${w}×${h}px.`);
    }
  });

  $("btnExportPng").addEventListener("click", () => {
    editor.exportPNG();
    setStatus("Exportado como PNG.");
  });

  $("btnSaveProj").addEventListener("click", () => {
    editor.exportProject();
    setStatus("Proyecto guardado (.json).");
  });

  $("projInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        editor.loadProject(JSON.parse(reader.result));
        setTimeout(fitZoom, 60);
        setStatus("Proyecto abierto.");
      } catch (err) {
        alert("No se pudo abrir el proyecto: " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  $("btnUndo").addEventListener("click", () => { editor.undo(); forcePanelRebuild(); });
  $("btnRedo").addEventListener("click", () => { editor.redo(); forcePanelRebuild(); });

  // ============================================================
  // Zoom
  // ============================================================
  let zoom = 1;
  function applyZoom(z) {
    zoom = Math.max(0.1, Math.min(6, z));
    canvas.style.width = canvas.width * zoom + "px";
    canvas.style.height = canvas.height * zoom + "px";
    $("zoomLabel").textContent = Math.round(zoom * 100) + "%";
    editor.render();
  }
  function fitZoom() {
    const pad = 48;
    const aw = canvasScroll.clientWidth - pad;
    const ah = canvasScroll.clientHeight - pad;
    applyZoom(Math.min(aw / canvas.width, ah / canvas.height, 1));
  }
  $("btnZoomIn").addEventListener("click", () => applyZoom(zoom * 1.2));
  $("btnZoomOut").addEventListener("click", () => applyZoom(zoom / 1.2));
  $("btnZoom100").addEventListener("click", () => applyZoom(1));
  $("btnZoomFit").addEventListener("click", fitZoom);
  window.addEventListener("resize", () => { /* keep current zoom */ });

  // ============================================================
  // Color helpers
  // ============================================================
  function parseColor(str) {
    if (!str || str === "none") return { hex: "#ffffff", alpha: 1, none: true };
    if (str[0] === "#") {
      let h = str;
      if (h.length === 4) h = "#" + h[1] + h[1] + h[2] + h[2] + h[3] + h[3];
      return { hex: h.slice(0, 7), alpha: 1, none: false };
    }
    const m = str.match(/rgba?\(([^)]+)\)/);
    if (m) {
      const parts = m[1].split(",").map((s) => parseFloat(s.trim()));
      const toHex = (n) => ("0" + Math.round(n).toString(16)).slice(-2);
      return {
        hex: "#" + toHex(parts[0]) + toHex(parts[1]) + toHex(parts[2]),
        alpha: parts[3] == null ? 1 : parts[3],
        none: false,
      };
    }
    return { hex: "#ffffff", alpha: 1, none: false };
  }
  function rgba(hex, alpha) {
    const h = hex.replace("#", "");
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // ============================================================
  // Properties panel
  // ============================================================
  let builtPanelKey = "__init__";

  function forcePanelRebuild() { builtPanelKey = "__force__"; refreshUI(); }

  editor.onChange = refreshUI;
  function refreshUI() {
    $("btnUndo").disabled = editor.history.length <= 1;
    $("btnRedo").disabled = editor.future.length === 0;
    const sel = editor.getSelected();
    const key = sel ? sel.id + ":" + sel.type : "none";
    if (key !== builtPanelKey) {
      buildPanel(sel);
      builtPanelKey = key;
    }
    syncToolButtons();
  }

  // helper builders ------------------------------------------------
  function el(html) {
    const t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstChild;
  }
  function fontOptions(selected) {
    return FONTS.map((f) => `<option value="${f}" ${f === selected ? "selected" : ""} style="font-family:'${f}'">${f}</option>`).join("");
  }

  function commit() { editor.pushHistory(); }

  function buildPanel(sel) {
    panelBody.innerHTML = "";
    if (!sel) { buildDefaultsPanel(); return; }
    panelTitle.textContent = typeTitle(sel.type);

    // ---- order / actions ----
    const actions = el(`
      <div class="field">
        <label>Orden y acciones</label>
        <div class="seg" style="margin-bottom:6px">
          <button id="pBack" title="Enviar al fondo">⤓ Fondo</button>
          <button id="pBackward" title="Atrás">−</button>
          <button id="pForward" title="Adelante">+</button>
          <button id="pFront" title="Traer al frente">⤒ Frente</button>
        </div>
        <button class="btn btn-block" id="pDup">⧉ Duplicar</button>
        <button class="btn btn-block danger" id="pDel">🗑 Eliminar</button>
      </div>
      <div class="divider"></div>
    `);
    panelBody.appendChild(actions);
    $("pBack").onclick = () => editor.reorder("back");
    $("pBackward").onclick = () => editor.reorder("backward");
    $("pForward").onclick = () => editor.reorder("forward");
    $("pFront").onclick = () => editor.reorder("front");
    $("pDup").onclick = () => editor.duplicateSelected();
    $("pDel").onclick = () => editor.deleteSelected();

    // ---- type-specific ----
    if (sel.type === "text") buildTextControls(sel, false);
    else if (sel.type === "textbox") buildTextControls(sel, true);
    else if (sel.type === "rect" || sel.type === "ellipse") buildShapeFillStroke(sel);
    else if (sel.type === "polygon") buildPolygonControls(sel);
    else if (sel.type === "polyline" || sel.type === "freehand") buildLineControls(sel, false);
    else if (sel.type === "arrow") buildLineControls(sel, true);
    else if (sel.type === "front") buildFrontControls(sel);
    else if (sel.type === "image") buildImageControls(sel);

    // ---- opacity (all) ----
    const op = el(`
      <div class="divider"></div>
      <div class="field">
        <label>Opacidad: <span id="opVal">${Math.round((sel.opacity ?? 1) * 100)}%</span></label>
        <input type="range" id="pOpacity" min="0" max="1" step="0.05" value="${sel.opacity ?? 1}" />
      </div>`);
    panelBody.appendChild(op);
    const opRange = $("pOpacity");
    opRange.oninput = () => { sel.opacity = parseFloat(opRange.value); $("opVal").textContent = Math.round(sel.opacity * 100) + "%"; editor.render(); };
    opRange.onchange = commit;
  }

  function colorField(labelTxt, id, value, withNone, noneChecked) {
    return `
      <div class="field">
        <label>${labelTxt}</label>
        <div class="row">
          <input type="color" id="${id}" value="${value}" />
          ${withNone ? `<label class="checkbox-row" style="flex:0 0 auto"><input type="checkbox" id="${id}None" ${noneChecked ? "checked" : ""}/> ninguno</label>` : ""}
        </div>
      </div>`;
  }

  function buildTextControls(sel, isBox) {
    const textColor = isBox ? (sel.textColor || "#111111") : (sel.color || "#111111");
    const wrap = el(`
      <div>
        <button class="btn btn-block" id="pEditText">✎ Editar texto</button>
        <div class="field">
          <label>Fuente</label>
          <select id="pFont">${fontOptions(sel.fontFamily || "Arial")}</select>
        </div>
        <div class="field">
          <label>Tamaño / Estilo</label>
          <div class="row">
            <input type="number" id="pFontSize" min="6" max="200" value="${sel.fontSize || 18}" />
            <div class="seg" style="flex:1.4">
              <button id="pBold" class="${sel.bold ? "on" : ""}" style="font-weight:bold">B</button>
              <button id="pItalic" class="${sel.italic ? "on" : ""}" style="font-style:italic">I</button>
            </div>
          </div>
        </div>
        <div class="field">
          <label>Alineación</label>
          <div class="seg">
            <button data-al="left" class="${(sel.align||'left')==='left'?'on':''}">⯇</button>
            <button data-al="center" class="${sel.align==='center'?'on':''}">≡</button>
            <button data-al="right" class="${sel.align==='right'?'on':''}">⯈</button>
          </div>
        </div>
        ${colorField("Color del texto", "pTextColor", textColor, false)}
        ${isBox ? colorField("Relleno de la caja", "pFill", parseColor(sel.fill).hex, true, parseColor(sel.fill).none) : ""}
        ${isBox ? colorField("Borde de la caja", "pStroke", parseColor(sel.stroke).hex, true, parseColor(sel.stroke).none) : ""}
        ${isBox ? `<div class="field"><label>Grosor del borde: <span id="bwVal">${sel.strokeWidth||3}</span>px</label><input type="range" id="pStrokeW" min="0" max="20" value="${sel.strokeWidth||3}" /></div>` : ""}
        ${!isBox ? `<div class="field"><label class="checkbox-row"><input type="checkbox" id="pHalo" ${sel.haloColor?'checked':''}/> Halo blanco (legibilidad)</label></div>` : ""}
      </div>`);
    panelBody.appendChild(wrap);

    $("pEditText").onclick = () => openTextEditor(sel);
    $("pFont").onchange = (e) => { sel.fontFamily = e.target.value; editor.setStyle({ fontFamily: e.target.value }); editor.render(); commit(); };
    const fs = $("pFontSize");
    fs.oninput = () => { sel.fontSize = parseInt(fs.value, 10) || 12; editor.render(); };
    fs.onchange = () => { editor.setStyle({ fontSize: sel.fontSize }); commit(); };
    $("pBold").onclick = () => { sel.bold = !sel.bold; $("pBold").classList.toggle("on", sel.bold); editor.render(); commit(); };
    $("pItalic").onclick = () => { sel.italic = !sel.italic; $("pItalic").classList.toggle("on", sel.italic); editor.render(); commit(); };
    panelBody.querySelectorAll("[data-al]").forEach((b) => b.onclick = () => {
      sel.align = b.dataset.al; editor.render(); commit();
      panelBody.querySelectorAll("[data-al]").forEach((x) => x.classList.toggle("on", x === b));
    });
    const tc = $("pTextColor");
    tc.oninput = () => { if (isBox) sel.textColor = tc.value; else sel.color = tc.value; editor.render(); };
    tc.onchange = commit;

    if (isBox) {
      bindColorNone("pFill", (v) => { sel.fill = v; }, () => sel.fill);
      bindColorNone("pStroke", (v) => { sel.stroke = v; }, () => sel.stroke);
      const sw = $("pStrokeW");
      sw.oninput = () => { sel.strokeWidth = parseInt(sw.value, 10); $("bwVal").textContent = sel.strokeWidth; editor.render(); };
      sw.onchange = commit;
    } else {
      $("pHalo").onchange = (e) => { sel.haloColor = e.target.checked ? "#ffffff" : null; editor.render(); commit(); };
    }
  }

  function bindColorNone(id, setVal, getVal) {
    const color = $(id);
    const none = $(id + "None");
    function apply() {
      if (none && none.checked) setVal("none");
      else setVal(color.value);
      editor.render();
    }
    color.oninput = apply;
    color.onchange = () => { apply(); commit(); };
    if (none) none.onchange = () => { apply(); commit(); };
  }

  function buildShapeFillStroke(sel) {
    const wrap = el(`
      <div>
        ${colorField("Relleno", "pFill", parseColor(sel.fill).hex, true, parseColor(sel.fill).none)}
        ${colorField("Borde", "pStroke", parseColor(sel.stroke).hex, true, parseColor(sel.stroke).none)}
        <div class="field"><label>Grosor: <span id="swVal">${sel.strokeWidth||2}</span>px</label>
          <input type="range" id="pStrokeW" min="0" max="30" value="${sel.strokeWidth||2}" /></div>
      </div>`);
    panelBody.appendChild(wrap);
    bindColorNone("pFill", (v) => { sel.fill = v; }, () => sel.fill);
    bindColorNone("pStroke", (v) => { sel.stroke = v; }, () => sel.stroke);
    const sw = $("pStrokeW");
    sw.oninput = () => { sel.strokeWidth = parseInt(sw.value, 10); $("swVal").textContent = sel.strokeWidth; editor.render(); };
    sw.onchange = commit;
  }

  function buildPolygonControls(sel) {
    const fc = parseColor(sel.fill);
    const wrap = el(`
      <div>
        ${colorField("Color de relleno", "pFillC", fc.hex, false)}
        <div class="field"><label>Opacidad del relleno: <span id="faVal">${Math.round(fc.alpha*100)}%</span></label>
          <input type="range" id="pFillA" min="0" max="1" step="0.05" value="${fc.alpha}" /></div>
        ${colorField("Borde", "pStroke", parseColor(sel.stroke).hex, true, parseColor(sel.stroke).none)}
        <div class="field"><label>Grosor del borde: <span id="swVal">${sel.strokeWidth||2}</span>px</label>
          <input type="range" id="pStrokeW" min="0" max="20" value="${sel.strokeWidth||2}" /></div>
        <div class="field"><label class="checkbox-row"><input type="checkbox" id="pDash" ${(sel.dash&&sel.dash.length)?'checked':''}/> Borde discontinuo</label></div>
      </div>`);
    panelBody.appendChild(wrap);
    const fcInp = $("pFillC"), faInp = $("pFillA");
    function applyFill() { sel.fill = rgba(fcInp.value, parseFloat(faInp.value)); $("faVal").textContent = Math.round(faInp.value*100)+"%"; editor.render(); }
    fcInp.oninput = applyFill; fcInp.onchange = commit;
    faInp.oninput = applyFill; faInp.onchange = commit;
    bindColorNone("pStroke", (v) => { sel.stroke = v; }, () => sel.stroke);
    const sw = $("pStrokeW");
    sw.oninput = () => { sel.strokeWidth = parseInt(sw.value, 10); $("swVal").textContent = sel.strokeWidth; editor.render(); };
    sw.onchange = commit;
    $("pDash").onchange = (e) => { sel.dash = e.target.checked ? [12, 8] : []; editor.render(); commit(); };
  }

  function buildLineControls(sel, isArrow) {
    const wrap = el(`
      <div>
        ${colorField("Color", "pStroke", parseColor(sel.stroke).hex, false)}
        <div class="field"><label>Grosor: <span id="swVal">${sel.strokeWidth||3}</span>px</label>
          <input type="range" id="pStrokeW" min="1" max="30" value="${sel.strokeWidth||3}" /></div>
        ${!isArrow ? `<div class="field"><label class="checkbox-row"><input type="checkbox" id="pDash" ${(sel.dash&&sel.dash.length)?'checked':''}/> Línea discontinua</label></div>` : ""}
        ${isArrow ? `<div class="field"><label class="checkbox-row"><input type="checkbox" id="pDouble" ${sel.doubleHead?'checked':''}/> Doble punta</label></div>` : ""}
      </div>`);
    panelBody.appendChild(wrap);
    const sc = $("pStroke");
    sc.oninput = () => { sel.stroke = sc.value; editor.setStyle({ stroke: sc.value }); editor.render(); };
    sc.onchange = commit;
    const sw = $("pStrokeW");
    sw.oninput = () => { sel.strokeWidth = parseInt(sw.value, 10); $("swVal").textContent = sel.strokeWidth; editor.setStyle({ strokeWidth: sel.strokeWidth }); editor.render(); };
    sw.onchange = commit;
    if (!isArrow) $("pDash").onchange = (e) => { sel.dash = e.target.checked ? [14, 9] : []; editor.render(); commit(); };
    if (isArrow) $("pDouble").onchange = (e) => { sel.doubleHead = e.target.checked; editor.render(); commit(); };
  }

  function buildFrontControls(sel) {
    const wrap = el(`
      <div>
        <div class="field">
          <label>Tipo de frente</label>
          <select id="pFrontType">
            ${FRONT_TYPES.map(([v, l]) => `<option value="${v}" ${sel.frontType===v?'selected':''}>${l}</option>`).join("")}
          </select>
        </div>
        <button class="btn btn-block" id="pFlip">⇋ Voltear lado de los símbolos</button>
        <div class="field"><label>Grosor de línea: <span id="lwVal">${sel.lineWidth||4}</span>px</label>
          <input type="range" id="pLineW" min="2" max="14" value="${sel.lineWidth||4}" /></div>
        <div class="field"><label>Tamaño de símbolos: <span id="scVal">${Math.round((sel.scale||1)*100)}%</span></label>
          <input type="range" id="pScale" min="0.5" max="2.5" step="0.1" value="${sel.scale||1}" /></div>
        <div class="muted-note">Tira de los puntos blancos sobre la línea para ajustar la curva del frente.</div>
      </div>`);
    panelBody.appendChild(wrap);
    $("pFrontType").onchange = (e) => { sel.frontType = e.target.value; editor.setStyle({ frontType: e.target.value }); editor.render(); commit(); };
    $("pFlip").onclick = () => { sel.side = (sel.side === -1 ? 1 : -1); editor.render(); commit(); };
    const lw = $("pLineW");
    lw.oninput = () => { sel.lineWidth = parseInt(lw.value, 10); $("lwVal").textContent = sel.lineWidth; editor.render(); };
    lw.onchange = commit;
    const sc = $("pScale");
    sc.oninput = () => { sel.scale = parseFloat(sc.value); $("scVal").textContent = Math.round(sel.scale*100)+"%"; editor.render(); };
    sc.onchange = commit;
  }

  function buildImageControls(sel) {
    const wrap = el(`<div class="muted-note">Imagen de fondo. Puedes moverla y redimensionarla con los tiradores. Carga una nueva imagen desde la barra superior para reemplazarla.</div>`);
    panelBody.appendChild(wrap);
  }

  function buildDefaultsPanel() {
    panelTitle.textContent = "Estilo por defecto";
    const s = editor.style;
    const wrap = el(`
      <div>
        <div class="muted-note" style="margin-bottom:12px">No hay nada seleccionado. Estos ajustes se aplican a los <b>nuevos</b> objetos que dibujes.</div>
        <div class="field">
          <label>Fuente de texto</label>
          <select id="dFont">${fontOptions(s.fontFamily)}</select>
        </div>
        <div class="field">
          <label>Tamaño de fuente</label>
          <input type="number" id="dFontSize" min="6" max="200" value="${s.fontSize}" />
        </div>
        ${colorField("Color de texto", "dTextColor", s.textColor, false)}
        <div class="divider"></div>
        ${colorField("Color de trazo (líneas/flechas)", "dStroke", s.stroke, false)}
        <div class="field"><label>Grosor de trazo: <span id="dswVal">${s.strokeWidth}</span>px</label>
          <input type="range" id="dStrokeW" min="1" max="30" value="${s.strokeWidth}" /></div>
        <div class="divider"></div>
        <button class="btn btn-block danger" id="dClearAnn">🧹 Borrar anotaciones (conservar imagen)</button>
        <button class="btn btn-block danger" id="dClearAll">🗑 Borrar todo</button>
      </div>`);
    panelBody.appendChild(wrap);
    $("dFont").onchange = (e) => editor.setStyle({ fontFamily: e.target.value });
    $("dFontSize").onchange = (e) => editor.setStyle({ fontSize: parseInt(e.target.value, 10) || 18 });
    $("dTextColor").onchange = (e) => editor.setStyle({ textColor: e.target.value });
    $("dStroke").onchange = (e) => editor.setStyle({ stroke: e.target.value });
    const dsw = $("dStrokeW");
    dsw.oninput = () => { $("dswVal").textContent = dsw.value; editor.setStyle({ strokeWidth: parseInt(dsw.value, 10) }); };
    $("dClearAnn").onclick = () => { if (confirm("¿Borrar todas las anotaciones y conservar la imagen?")) editor.clearAnnotations(); };
    $("dClearAll").onclick = () => { if (confirm("¿Borrar TODO el lienzo?")) editor.clearAll(); };
  }

  function typeTitle(t) {
    return ({
      text: "Texto", textbox: "Caja de texto", rect: "Rectángulo", ellipse: "Elipse",
      polygon: "Área / polígono", polyline: "Poli-línea", freehand: "Trazo libre",
      arrow: "Flecha", front: "Frente", image: "Imagen de fondo",
    })[t] || "Propiedades";
  }

  // ============================================================
  // Inline text editor
  // ============================================================
  let editingShape = null;
  editor.onEditText = openTextEditor;

  function openTextEditor(shape) {
    editingShape = shape;
    const b = Shapes.bounds(shape);
    const r = canvas.getBoundingClientRect();
    const scale = r.width / canvas.width;
    const left = r.left + b.x * scale;
    const top = r.top + b.y * scale;
    const fontPx = (shape.fontSize || 18) * scale;
    textEditor.style.display = "block";
    textEditor.style.left = left + "px";
    textEditor.style.top = top + "px";
    textEditor.style.width = Math.max(60, (shape.type === "textbox" ? b.w * scale : 200)) + "px";
    textEditor.style.minHeight = Math.max(fontPx * 1.4, b.h * scale) + "px";
    textEditor.style.fontFamily = shape.fontFamily || "Arial";
    textEditor.style.fontSize = fontPx + "px";
    textEditor.style.fontWeight = shape.bold ? "bold" : "normal";
    textEditor.style.fontStyle = shape.italic ? "italic" : "normal";
    textEditor.style.textAlign = shape.align || "left";
    textEditor.value = shape.text || "";
    setStatus("Editando texto — Esc o Ctrl+Enter para confirmar.");
    setTimeout(() => { textEditor.focus(); textEditor.select(); autoGrow(); }, 10);
  }
  function autoGrow() {
    textEditor.style.height = "auto";
    textEditor.style.height = textEditor.scrollHeight + "px";
  }
  function commitTextEditor() {
    if (!editingShape) return;
    const val = textEditor.value;
    const shape = editingShape;
    editingShape = null;
    textEditor.style.display = "none";
    if (shape.type === "text" && val.trim() === "") {
      editor.objects = editor.objects.filter((o) => o.id !== shape.id);
      if (editor.selectedId === shape.id) editor.selectedId = null;
    } else {
      shape.text = val;
    }
    editor.pushHistory();
    editor.render();
    forcePanelRebuild();
    setStatus("Texto actualizado.");
  }
  textEditor.addEventListener("input", autoGrow);
  textEditor.addEventListener("blur", commitTextEditor);
  textEditor.addEventListener("keydown", (e) => {
    if (e.key === "Escape" || (e.key === "Enter" && (e.ctrlKey || e.metaKey))) {
      e.preventDefault(); textEditor.blur();
    }
  });

  // ============================================================
  // Keyboard shortcuts
  // ============================================================
  window.addEventListener("keydown", (e) => {
    if (document.activeElement === textEditor) return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "select" || tag === "textarea") return;

    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !e.shiftKey) { e.preventDefault(); editor.undo(); forcePanelRebuild(); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === "y" || (e.key.toLowerCase() === "z" && e.shiftKey))) { e.preventDefault(); editor.redo(); forcePanelRebuild(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "d") { e.preventDefault(); editor.duplicateSelected(); return; }

    if (e.key === "Delete" || e.key === "Backspace") { editor.deleteSelected(); return; }
    if (e.key === "Enter") { if (editor.draft) editor._finishDraft(); return; }
    if (e.key === "Escape") { if (editor.draft) editor.cancelDraft(); else { editor.setTool("select"); selectToolBtn("select"); } return; }

    // nudge
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
      const sel = editor.getSelected();
      if (sel) {
        e.preventDefault();
        const step = e.shiftKey ? 10 : 1;
        const d = { ArrowUp: [0, -step], ArrowDown: [0, step], ArrowLeft: [-step, 0], ArrowRight: [step, 0] }[e.key];
        Shapes.move(sel, d[0], d[1]); editor.render(); editor.pushHistory();
      }
      return;
    }

    // tool shortcuts
    const map = { v: "select", t: "text", b: "place-textbox", a: "arrow", l: "polyline", p: "freehand", g: "polygon", r: "rect", e: "ellipse" };
    if (map[e.key.toLowerCase()] && !e.ctrlKey && !e.metaKey) {
      editor.setTool(map[e.key.toLowerCase()]);
      selectToolBtn(map[e.key.toLowerCase()]);
    }
  });

  function selectToolBtn(tool) {
    const btn = toolButtons.find((b) => b.dataset.tool === tool && !b.dataset.front);
    activateToolButton(btn);
    updateToolHint(tool);
  }

  // ============================================================
  // init
  // ============================================================
  selectToolBtn("select");
  refreshUI();
  fitZoom();
  setStatus("Listo. Carga una imagen de radar/satélite para comenzar (botón 'Cargar imagen').");
})();

</script>

  <!-- Pegar (Ctrl+V) y arrastrar-soltar imágenes: reutiliza el selector de archivos -->
  <script>
  (function () {
    "use strict";
    const input = document.getElementById("imageInput");
    const stage = document.getElementById("stage");
    const statusbar = document.getElementById("statusbar");

    function loadImageFile(file) {
      if (!file || !/^image\//.test(file.type)) return false;
      try {
        const dt = new DataTransfer();
        dt.items.add(file);
        input.files = dt.files;
        input.dispatchEvent(new Event("change", { bubbles: true }));
      } catch (err) {
        // Fallback si DataTransfer no está disponible: leer directo
        const reader = new FileReader();
        reader.onload = () => input.dispatchEvent(new CustomEvent("imagedata", { detail: reader.result }));
        reader.readAsDataURL(file);
      }
      if (statusbar) statusbar.textContent = "Imagen recibida desde el portapapeles / arrastrar.";
      return true;
    }

    // --- Pegar desde el portapapeles ---
    window.addEventListener("paste", function (e) {
      const items = (e.clipboardData && e.clipboardData.items) || [];
      for (const it of items) {
        if (it.kind === "file" && /^image\//.test(it.type)) {
          if (loadImageFile(it.getAsFile())) e.preventDefault();
          return;
        }
      }
    });

    // --- Arrastrar y soltar ---
    ["dragenter", "dragover"].forEach((ev) =>
      window.addEventListener(ev, (e) => { e.preventDefault(); if (stage) stage.style.outline = "2px dashed #2f81f7"; })
    );
    ["dragleave", "drop"].forEach((ev) =>
      window.addEventListener(ev, () => { if (stage) stage.style.outline = ""; })
    );
    window.addEventListener("drop", function (e) {
      e.preventDefault();
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) loadImageFile(f);
    });
  })();
  </script>
